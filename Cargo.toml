[package]
name = "axsh"
version = "0.5.0"
edition = "2024"
license = "MIT"
authors = ["Thomas Habets <thomas@habets.se>"]
readme = "README.md"
repository = "https://github.com/ThomasHabets/axsh"
description = "Amateur radio compliant secure shell"
keywords = ["radio"]

[dependencies]
agw = "0.4.3"
#agw = { path = "../agw" }
anyhow = "1.0.102"
aws-lc-rs = { version = "1.16.3", features = ["unstable"] }
clap = { version = "4.6.1", features = ["derive"] }
log = "0.4.29"
stderrlog = "0.6.0"
tokio = { version = "1.52.1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread" ] }

[lib]
name = "axsh"
path = "src/lib.rs"
